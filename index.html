<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oyunlar</title>
<meta name="theme-color" content="#0b0f17">
<style>
:root{--bg:#0b0f17;--card:#151c2c;--line:#24304a;--text:#e8edf7;--muted:#8a96ad;--amber:#ffb020;--green:#35e08a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1000px 400px at 50% -150px,#1b2742,transparent 70%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:40px 16px}
h1{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a.game{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s,transform .1s}
a.game:hover{border-color:var(--amber);transform:translateY(-1px)}
.dial{width:44px;height:44px;border-radius:50%;border:4px solid var(--amber);position:relative;flex:none}
.dial:after{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
.t{font-weight:700;font-size:18px}.d{color:var(--muted);font-size:14px;margin-top:2px}
</style>
</head>
<body>
<div class="wrap">
  <h1>OYUNLAR</h1>
  <p>İki nəfərlik onlayn oyunlar. Linki dostunuza göndərin və oynayın.</p>
  <a class="game" href="sifre-doyusu/">
    <div class="dial"></div>
    <div><div class="t">Şifrə Döyüşü</div><div class="d">Rəqibin 4 rəqəmli şifrəsini ondan tez tap.</div></div>
  </a>
</div>
</body>
</html>
